<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MALTINOME</title>
    <link rel="stylesheet" href="style.css?v=1.27">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <script>
        // if ('serviceWorker' in navigator) {
        //     window.addEventListener('load', () => {
        //         navigator.serviceWorker.register('./sw.js')
        //             .then(reg => console.log('Service Worker registered', reg))
        //             .catch(err => console.error('Service Worker creation failed', err));
        //     });
        // }
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>MALTINOME</h1>
        </header>

        <main>
            <!-- Preset Management Section -->
            <div id="preset-section" class="preset-section">
                <button type="button" id="preset-toggle-btn" class="preset-toggle-header">プリセット ▼</button>

                <div id="preset-content-body" class="preset-content-body">
                    <div id="preset-load-section" class="preset-sub-section">
                        <h3>読込/削除</h3>
                        <div class="preset-controls">
                            <select id="folder-select" class="preset-select folder-select">
                                <option value="">-- フォルダを選択 --</option>
                            </select>
                            <select id="preset-select" class="preset-select">
                                <option value="">-- プリセットを選択 --</option>
                            </select>
                            <div class="preset-actions">
                                <button id="load-preset-btn" class="preset-btn load-btn" title="読み込み">📥</button>
                                <button id="delete-preset-btn" class="preset-btn delete-btn" title="削除">🗑️</button>
                            </div>
                        </div>
                    </div>

                    <div class="preset-sub-section">
                        <h3 id="new-creation-title">新規作成</h3>
                        <div class="preset-save-controls">
                            <div id="preset-folder-save-controls" class="save-folder-container">
                                <select id="save-folder-select" class="preset-select">
                                    <option value="new">新規フォルダ作成</option>
                                </select>
                                <input type="text" id="new-folder-input" class="preset-name-input"
                                    placeholder="フォルダ名を入力..." maxlength="20">
                            </div>
                            <div class="save-preset-container">
                                <div id="local-save-controls" class="local-save-wrapper" style="width: 100%;">
                                    <input type="text" id="preset-name-input" class="preset-name-input"
                                        placeholder="プリセット名を入力..." maxlength="30">
                                    <button id="save-preset-btn" class="preset-btn save-btn" title="保存">💾</button>
                                </div>
                                <div id="share-result-container" class="share-result-container">
                                    <button id="share-preset-btn" class="preset-btn share-btn"
                                        title="URLで共有">🔗</button>
                                    <input type="text" id="share-url-input" class="preset-name-input share-url-input"
                                        placeholder="共有URLがここに表示されます" readonly>
                                    <button id="copy-share-url-btn" class="preset-btn copy-btn"
                                        title="URLをコピー">📋</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="metronomes-container"></div>

            <button class="add-btn" id="add-metronome-btn" title="メトロノームを追加">＋</button>

            <!-- Play/Stop Button -->
            <button class="play-btn" id="play-btn">
                <span class="play-icon">▶</span>
                <span class="btn-text">スタート</span>
            </button>
            <footer class="app-footer">made for SiA v2.1.0</footer>
        </main>
    </div>

    <template id="metronome-template">
        <div class="metronome-unit">
            <div class="unit-controls">
                <button class="unit-play-btn" title="再生/停止">▶</button>
                <button class="tap-btn" title="TAP">TAP</button>
                <button class="remove-btn" title="削除">×</button>
            </div>
            <!-- Tempo Display -->
            <div class="tempo-display">
                <input type="number" class="tempo-input" min="5" max="999" value="120">
                <span class="tempo-label">BPM</span>
            </div>

            <!-- Tempo Slider -->
            <div class="tempo-control">
                <button class="tempo-btn tempo-down">−</button>
                <input type="range" class="tempo-slider" min="5" max="999" value="120">
                <button class="tempo-btn tempo-up">+</button>
            </div>

            <!-- Beat Indicator -->
            <div class="beat-indicator">
                <div class="beat-dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- Rhythm Practice Section -->
            <button type="button" class="rhythm-practice-toggle detail-toggle">リズム練習 ▼</button>

            <div class="rhythm-practice-settings">
                <div class="practice-display">
                    <span class="evaluation-text">---</span>
                    <div class="combo-display">
                        <span class="combo-count">0</span>
                        <span class="combo-label">COMBO</span>
                    </div>
                    <div class="evaluation-counts">
                        <div class="count-item excellent">
                            <span class="count-label">EXCELLENT</span>
                            <span class="count-value" data-type="excellent">0</span>
                        </div>
                        <div class="count-item great">
                            <span class="count-label">GREAT</span>
                            <span class="count-value" data-type="great">0</span>
                        </div>
                        <div class="count-item nice">
                            <span class="count-label">NICE</span>
                            <span class="count-value" data-type="nice">0</span>
                        </div>
                        <div class="count-item miss">
                            <span class="count-label">MISS</span>
                            <span class="count-value" data-type="miss">0</span>
                        </div>
                    </div>
                </div>
                <div class="practice-controls">
                    <div class="mode-select">
                        <button class="practice-mode-btn active" data-mode="main">表拍</button>
                        <button class="practice-mode-btn" data-mode="offbeat">裏拍</button>
                        <button class="practice-mode-btn" data-mode="both">両拍</button>
                    </div>
                    <button class="evaluation-reset-btn">リセット</button>
                </div>

                <div class="practice-tap-container">
                    <button class="practice-tap-area">TAP</button>
                    <button class="practice-tap-area" style="display: none;">TAP</button>
                </div>

                <button type="button" class="detail-toggle practice-detail-toggle">設定 ▼</button>
                <div class="practice-detail-settings">
                    <!-- Tap Volume (Main) -->
                    <div class="volume-section section-divider">
                        <h2>TAP音量調整</h2>
                        <div class="volume-label">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span> 表拍</span>
                                <button class="step-toggle-btn practice-vol-step-btn" title="調整幅切り替え">Skip</button>
                            </div>
                            <div class="volume-input-group">
                                <input type="number" class="volume-input practice-volume-input" value="100" min="0"
                                    max="500">
                                <span class="volume-unit">%</span>
                            </div>
                        </div>
                        <div class="volume-control">
                            <button class="mute-btn practice-mute-btn" title="ミュート">🔈</button>
                            <input type="range" class="practice-volume-slider" min="0" max="500" value="100">
                            <button class="volume-up-btn practice-volume-up" title="+10%">🔊</button>
                        </div>
                    </div>

                    <!-- Tap Volume (Offbeat) -->
                    <div class="volume-section offbeat-volume">
                        <div class="volume-label">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span> 裏拍</span>
                                <button class="step-toggle-btn practice-off-vol-step-btn" title="調整幅切り替え">Skip</button>
                            </div>
                            <div class="volume-input-group">
                                <input type="number" class="volume-input practice-off-volume-input" value="100" min="0"
                                    max="500">
                                <span class="volume-unit">%</span>
                            </div>
                        </div>
                        <div class="volume-control">
                            <button class="mute-btn practice-off-mute-btn" title="ミュート">🔈</button>
                            <input type="range" class="practice-off-volume-slider offbeat-volume-slider" min="0"
                                max="500" value="100">
                            <button class="volume-up-btn practice-off-volume-up" title="+10%">🔊</button>
                        </div>
                    </div>

                    <!-- Tap Pitch (Main) -->
                    <div class="volume-section pitch-section section-divider">
                        <h2>TAPピッチ調整</h2>
                        <div class="volume-label">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span> 表拍</span>
                                <button class="step-toggle-btn practice-pitch-step-btn" title="調整幅切り替え">Skip</button>
                                <button class="tuning-fork-btn practice-pitch-fork-btn" title="再生/停止">♪</button>
                            </div>
                            <div class="pitch-control-group">
                                <input type="number" class="pitch-input practice-pitch-input" value="783.991" min="20"
                                    max="5000" step="0.001">
                                <span class="pitch-unit">Hz</span>
                                <span class="practice-pitch-note-display pitch-note-display-inline"></span>
                            </div>
                        </div>
                        <div class="volume-control">
                            <button class="pitch-btn practice-pitch-down" title="半音下げる">−</button>
                            <input type="range" class="practice-pitch-slider pitch-slider" min="20" max="5000"
                                value="783.991" step="0.001">
                            <button class="pitch-btn practice-pitch-up" title="半音上げる">+</button>
                        </div>
                    </div>

                    <div class="volume-section offbeat-pitch-section">
                        <div class="volume-label">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span> 裏拍</span>
                                <button class="step-toggle-btn practice-off-pitch-step-btn"
                                    title="調整幅切り替え">Skip</button>
                                <button class="tuning-fork-btn practice-off-fork-btn" title="再生/停止">♪</button>
                            </div>
                            <div class="pitch-control-group">
                                <input type="number" class="pitch-input practice-off-pitch-input" value="587.330"
                                    min="20" max="5000" step="0.001">
                                <span class="pitch-unit">Hz</span>
                                <span class="practice-off-pitch-note-display pitch-note-display-inline"></span>
                            </div>
                        </div>
                        <div class="volume-control">
                            <button class="pitch-btn practice-off-pitch-down" title="半音下げる">−</button>
                            <input type="range" class="practice-off-pitch-slider offbeat-pitch-slider" min="20"
                                max="5000" value="587.330" step="0.001">
                            <button class="pitch-btn practice-off-pitch-up" title="半音上げる">+</button>
                        </div>
                    </div>
                    <div class="volume-section combo-settings-section section-divider">
                        <h2>コンボ判定</h2>
                        <button type="button" class="visual-mode-toggle" id="combo-mode-toggle">
                            <span class="visual-mode-label" style="display:none">コンボ判定</span>
                            <span class="visual-mode-value">EXCELLENT+GREAT</span>
                        </button>
                    </div>

                    <div class="volume-section judge-muted-setting section-divider"
                        style="display: flex; flex-direction: column; align-items: center; margin-top: 16px;">
                        <h2>判定対象</h2>
                        <button type="button" class="visual-mode-toggle" id="judge-muted-mode-toggle"
                            style="width: auto; min-width: 200px;">
                            <span class="visual-mode-label" style="display:none">ミュート判定</span>
                            <span class="visual-mode-value">通常 (ミュート除外)</span>
                        </button>
                    </div>

                    <!-- TAP Button Count Toggle -->
                    <div class="volume-section tap-count-setting section-divider"
                        style="display: flex; flex-direction: column; align-items: center; margin-top: 16px;">
                        <h2>TAPボタン数</h2>
                        <button type="button" class="tap-count-toggle" id="tap-count-toggle">
                            <span class="toggle-label">1つ</span>
                            <div class="toggle-switch">
                                <div class="toggle-slider"></div>
                            </div>
                            <span class="toggle-label">2つ</span>
                        </button>
                    </div>
                </div>
            </div>

            <button type="button" class="detail-toggle main-detail-toggle">詳細設定 ▼</button>

            <div class="detail-settings">
                <!-- Rhythm Pattern Selection -->
                <div class="rhythm-section section-divider">
                    <h2>リズムパターン</h2>
                    <div class="rhythm-buttons">
                        <button class="rhythm-btn active" data-pattern="quarter">
                            <div class="rhythm-visual quarter-visual">
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                            </div>
                            <span class="rhythm-name">4/4拍子</span>
                        </button>
                        <button class="rhythm-btn" data-pattern="three-four">
                            <div class="rhythm-visual three-four-visual">
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                            </div>
                            <span class="rhythm-name">3/4拍子</span>
                        </button>
                        <button class="rhythm-btn" data-pattern="triplet">
                            <div class="rhythm-visual triplet-visual">
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                            </div>
                            <span class="rhythm-name">3連符</span>
                        </button>

                        <button class="rhythm-btn" data-pattern="sextuplet">
                            <div class="rhythm-visual sextuplet-visual">
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                                <span class="beat">●</span>
                            </div>
                            <span class="rhythm-name">6連符</span>
                        </button>
                    </div>
                </div>

                <!-- Volume Control -->
                <div class="volume-section section-divider">
                    <h2>音量調整</h2>
                    <div class="volume-label">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span> 表拍</span>
                            <button class="step-toggle-btn vol-step-btn" title="調整幅切り替え">Skip</button>
                        </div>
                        <div class="volume-input-group">
                            <input type="number" class="volume-input main-volume-input" value="100" min="0" max="500">
                            <span class="volume-unit">%</span>
                        </div>
                    </div>
                    <div class="volume-control">
                        <button class="mute-btn main-mute-btn" title="-10%">🔈</button>
                        <input type="range" class="volume-slider" min="0" max="500" value="100">
                        <button class="volume-up-btn main-volume-up" title="+10%">🔊</button>
                    </div>
                </div>

                <!-- Offbeat Volume Control -->
                <div class="volume-section offbeat-volume">
                    <div class="volume-label">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span> 裏拍</span>
                            <button class="step-toggle-btn offbeat-vol-step-btn" title="調整幅切り替え">Skip</button>
                        </div>
                        <div class="volume-input-group">
                            <input type="number" class="volume-input offbeat-volume-input" value="0" min="0" max="500">
                            <span class="volume-unit">%</span>
                        </div>
                    </div>
                    <div class="volume-control">
                        <button class="mute-btn muted offbeat-mute-btn" title="ミュート">🔇</button>
                        <input type="range" class="offbeat-volume-slider" min="0" max="500" value="0">
                        <button class="volume-up-btn offbeat-volume-up" title="+10%">🔊</button>
                    </div>
                </div>

                <div class="volume-section pitch-section section-divider">
                    <h2>ピッチ調整(Hz)</h2>
                    <div class="volume-label">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span> 表拍</span>
                            <button class="step-toggle-btn pitch-step-btn" title="調整幅切り替え">Skip</button>
                            <button class="tuning-fork-btn pitch-fork-btn" title="再生/停止">♪</button>
                        </div>
                        <div class="pitch-control-group">
                            <input type="number" class="pitch-input main-pitch-input" value="783.991" min="20"
                                max="5000" step="0.001">
                            <span class="pitch-unit">Hz</span>
                            <span class="pitch-note-display pitch-note-display-inline"></span>
                        </div>
                    </div>
                    <div class="volume-control">
                        <button class="pitch-btn pitch-down" title="半音下げる">−</button>
                        <input type="range" class="pitch-slider" min="20" max="5000" value="783.991" step="0.001">
                        <button class="pitch-btn pitch-up" title="半音上げる">+</button>
                    </div>
                </div>

                <div class="volume-section offbeat-pitch-section">
                    <div class="volume-label">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span> 裏拍</span>
                            <button class="step-toggle-btn offbeat-pitch-step-btn" title="調整幅切り替え">Skip</button>
                            <button class="tuning-fork-btn offbeat-fork-btn" title="再生/停止">♪</button>
                        </div>
                        <div class="pitch-control-group">
                            <input type="number" class="pitch-input offbeat-pitch-input" value="587.330" min="20"
                                max="5000" step="0.001">
                            <span class="pitch-unit">Hz</span>
                            <span class="offbeat-pitch-note-display pitch-note-display-inline"></span>
                        </div>
                    </div>
                    <div class="volume-control">
                        <button class="pitch-btn offbeat-pitch-down" title="半音下げる">−</button>
                        <input type="range" class="offbeat-pitch-slider" min="20" max="5000" value="587.330"
                            step="0.001">
                        <button class="pitch-btn offbeat-pitch-up" title="半音上げる">+</button>
                    </div>
                </div>

                <!-- Click Multiplier Selection -->
                <div class="multiplier-section section-divider">
                    <h2>クリック倍数</h2>
                    <span> 表拍</span>
                    <div class="multiplier-buttons">
                        <button class="multiplier-btn active" data-multiplier="1">x1</button>
                        <button class="multiplier-btn" data-multiplier="2">x2</button>
                        <button class="multiplier-btn" data-multiplier="3">x3</button>
                        <button class="multiplier-btn" data-multiplier="4">x4</button>
                    </div>
                </div>

                <!-- Offbeat Multiplier Selection -->
                <div class="multiplier-section">
                    <span> 裏拍</span>
                    <div class="multiplier-buttons">
                        <button class="offbeat-mult-btn active" data-multiplier="1">x1</button>
                        <button class="offbeat-mult-btn" data-multiplier="2">x2</button>
                        <button class="offbeat-mult-btn" data-multiplier="3">x3</button>
                        <button class="offbeat-mult-btn" data-multiplier="4">x4</button>
                    </div>
                </div>

                <!-- Start Beat Toggle -->
                <div class="offbeat-section detail-control-section section-divider">
                    <h2>開始拍</h2>
                    <button class="offbeat-toggle">
                        <span class="toggle-label">表拍開始</span>
                        <div class="toggle-switch">
                            <div class="toggle-slider"></div>
                        </div>
                        <span class="toggle-label">裏拍開始</span>
                    </button>
                </div>

                <!-- Accent Toggle -->
                <div class="accent-section detail-control-section section-divider">
                    <h2>1拍目にアクセント</h2>
                    <button class="accent-toggle active">
                        <span class="accent-icon"></span>
                        <span class="accent-label">ON</span>
                        <div class="accent-switch">
                            <div class="accent-slider"></div>
                        </div>
                    </button>
                </div>

                <!-- Visual Mode Toggle -->
                <div class="visual-mode-section detail-control-section section-divider">
                    <h2>インパクト表示</h2>
                    <button type="button" class="visual-mode-toggle" id="impact-visual-toggle" data-mode="main">
                        <span class="visual-mode-label" style="display:none">インパクト表示</span>
                        <span class="visual-mode-value">表拍だけ表示</span>
                    </button>
                </div>
            </div>
        </div>
    </template>
    </div>

    <script src="script.js?v=1.25"></script>
</body>

</html>
